# Dependency update automation for the Intel fork.
# Dependabot PRs are gated by the existing ci.yaml (same checks upstream runs);
# merges to master trigger build-intel-images.yaml, which publishes images.
version: 2
updates:
  # Backend is pinned to the Django 4.0 branch upstream chose: majors
  # (Django 5, Pillow 13) are left as manual PRs; minor/patch arrive grouped.
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 15
    labels:
      - dependencies
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/ml_api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 15
    labels:
      - dependencies
    groups:
      ml-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 15
    labels:
      - dependencies
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base-image FROM lines (backend/Dockerfile[.base], ml_api/Dockerfile[.intel]).
  # Watch python majors against Django 4.0 support windows before merging.
  - package-ecosystem: docker
    directories: ["/backend", "/ml_api"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
