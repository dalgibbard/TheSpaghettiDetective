# Portainer-ready Intel GPU deployment. This stack uses published images and
# does not require the repository source tree or bind-mounted application code.

x-web-environment: &web-environment
  OCTOPRINT_TUNNEL_PORT_RANGE: '0-0'
  EMAIL_HOST: '${EMAIL_HOST-}'
  EMAIL_HOST_USER: '${EMAIL_HOST_USER-}'
  EMAIL_HOST_PASSWORD: '${EMAIL_HOST_PASSWORD-}'
  EMAIL_PORT: '${EMAIL_PORT-587}'
  EMAIL_USE_TLS: '${EMAIL_USE_TLS-True}'
  DEFAULT_FROM_EMAIL: '${DEFAULT_FROM_EMAIL-changeme@example.com}'
  DEBUG: '${DEBUG-False}'
  ADMIN_IP_WHITELIST: '${ADMIN_IP_WHITELIST-}'
  SITE_USES_HTTPS: '${SITE_USES_HTTPS-False}'
  SITE_IS_PUBLIC: '${SITE_IS_PUBLIC-False}'
  CSRF_TRUSTED_ORIGINS: '${CSRF_TRUSTED_ORIGINS-}'
  SOCIAL_LOGIN: '${SOCIAL_LOGIN-False}'
  REDIS_URL: '${REDIS_URL-redis://redis:6379}'
  DATABASE_URL: '${DATABASE_URL-sqlite:////data/db.sqlite3}'
  INTERNAL_MEDIA_HOST: '${INTERNAL_MEDIA_HOST-http://web:3334}'
  ML_API_HOST: '${ML_API_HOST-http://ml_api:3333}'
  ACCOUNT_ALLOW_SIGN_UP: '${ACCOUNT_ALLOW_SIGN_UP-False}'
  WEBPACK_LOADER_ENABLED: '${WEBPACK_LOADER_ENABLED-False}'
  TELEGRAM_BOT_TOKEN: '${TELEGRAM_BOT_TOKEN-}'
  TWILIO_ACCOUNT_SID: '${TWILIO_ACCOUNT_SID-}'
  TWILIO_AUTH_TOKEN: '${TWILIO_AUTH_TOKEN-}'
  TWILIO_FROM_NUMBER: '${TWILIO_FROM_NUMBER-}'
  SENTRY_DSN: '${SENTRY_DSN-}'
  PUSHOVER_APP_TOKEN: '${PUSHOVER_APP_TOKEN-}'
  SLACK_CLIENT_ID: '${SLACK_CLIENT_ID-}'
  SLACK_CLIENT_SECRET: '${SLACK_CLIENT_SECRET-}'
  DJANGO_SECRET_KEY: '${DJANGO_SECRET_KEY-}'
  SYNDICATE: '${SYNDICATE-}'
  VERSION: '${VERSION-}'
  LLM_API_KEY: '${LLM_API_KEY-}'
  LLM_BASE_URL: '${LLM_BASE_URL-https://api.openai.com/v1}'
  LLM_MODEL_NAME: '${LLM_MODEL_NAME-gpt-4o}'
  VLM_API_KEY: '${VLM_API_KEY-}'
  VLM_BASE_URL: '${VLM_BASE_URL-https://api.openai.com/v1}'
  VLM_MODEL_NAME: '${VLM_MODEL_NAME-gpt-4o}'
  JUSPRIN_BRAND_NAME: '${JUSPRIN_BRAND_NAME-JusPrin}'

services:
  ml_api:
    image: dalgibbard/obico-ml-api:intel-4e252f33
    hostname: ml_api
    restart: unless-stopped
    environment:
      DEBUG: 'True'
      FLASK_APP: 'server.py'
      ML_API_GPU_PROVIDER: OpenVINOExecutionProvider
      ML_API_OPENVINO_DEVICE: GPU
    devices:
      - /dev/dri:/dev/dri
    # Keep the render-node group available if the image is later run as a
    # non-root user. TrueNAS commonly uses GID 107 for the render group.
    group_add:
      - '${INTEL_RENDER_GROUP-107}'
    tty: true
    command: bash -c "gunicorn --bind 0.0.0.0:3333 --workers 1 --timeout 120 wsgi"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --no-check-certificate http://ml_api:3333/hc/"]
      start_period: 140s
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: dalgibbard/obico-web:intel-b514bbb4
    hostname: web
    restart: unless-stopped
    volumes:
      - obico_db:/data
      - obico_media:/app/static_build/media
    depends_on:
      - redis
      - ml_api
    ports:
      - "3334:3334"
    environment: *web-environment
    command: sh -c 'python manage.py migrate && python manage.py collectstatic -v 2 --noinput && daphne -b 0.0.0.0 -p 3334 config.routing:application'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --no-check-certificate http://web:3334/hc/"]
      start_period: 30s
      interval: 90s
      timeout: 20s
      retries: 3

  tasks:
    image: dalgibbard/obico-web:intel-b514bbb4
    hostname: tasks
    restart: unless-stopped
    volumes:
      - obico_db:/data
      - obico_media:/app/static_build/media
    depends_on:
      - redis
    environment: *web-environment
    command: sh -c "celery -A config worker --beat -l info -c 2 -Q realtime,celery"
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping"]
      start_period: 15s
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - obico_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      start_period: 15s
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  obico_db:
  obico_media:
  obico_redis:
